<!doctype html><meta charset="utf-8"><title>latency timer</title>
<body style="margin:0;background:#000;color:#0f0;font:bold 20vw/1 monospace;display:flex;align-items:center;justify-content:center;height:100vh">
<div id="t">0.000</div>
<script>const e=document.getElementById('t');(function f(){e.textContent=(performance.now()/1000).toFixed(3);requestAnimationFrame(f)})()</script>
